# Weekly FFmpeg 9.1 builds for Alpine/musl. Master is built separately and
# daily in .github/workflows/ffmpeg-master.yml.
name: Build FFmpeg 9.1 musl

on:
  push:
    paths:
      - 'docker/ffmpeg-musl/**'
      - '.github/workflows/ffmpeg-musl.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ffmpeg-9.1-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [full, trimmed]
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build FFmpeg 9.1 (${{ matrix.variant }}, ${{ matrix.arch }})
        env:
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          SOURCE_VERSION=9.1
          SOURCE_URL="https://ffmpeg.org/releases/ffmpeg-9.1.tar.xz"
          SHA="1a4d394ae63d190a526cd052eb4415c156b5c5e2df37efab41a7de0b8fde2433"
          PLATFORM=linux/amd64
          if [ "$ARCH" = aarch64 ]; then PLATFORM=linux/arm64; fi
          mkdir -p dist artifacts
          docker buildx build \
            --platform "$PLATFORM" \
            --target artifact \
            --output type=local,dest=dist \
            --build-arg FFMPEG_VERSION="$SOURCE_VERSION" \
            --build-arg FFMPEG_SOURCE_URL="$SOURCE_URL" \
            --build-arg FFMPEG_SHA256="$SHA" \
            -f "docker/ffmpeg-musl/$VARIANT/Dockerfile" \
            "docker/ffmpeg-musl/$VARIANT"
          test -x dist/opt/ffmpeg/bin/ffmpeg
          test -x dist/opt/ffmpeg/bin/ffprobe

      - name: Package artifact
        env:
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        run: |
          tar --sort=name \
            --mtime='UTC 2020-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -cJf "artifacts/ffmpeg-9.1-musl-$VARIANT-$ARCH.tar.xz" \
            -C dist/opt ffmpeg

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-9.1-${{ matrix.variant }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-9.1-*
          merge-multiple: true
          path: artifacts

      - name: Checksums
        run: |
          cd artifacts
          sha256sum *.tar.xz > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: musl-9.1
          name: FFmpeg 9.1 musl runtime
          body: |
            FFmpeg 9.1 for Alpine/musl.

            Assets: `ffmpeg-9.1-musl-<variant>-<arch>.tar.xz`, `SHA256SUMS`.
            Variants: full (Alpine feature set), trimmed (bot codec/filter set).
            Architectures: x86_64, aarch64.

            Rebuilt weekly and on Dockerfile changes. Verify downloads against
            `SHA256SUMS`.
          files: artifacts/*
          fail_on_unmatched_files: true
