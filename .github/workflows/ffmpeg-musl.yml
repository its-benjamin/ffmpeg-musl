# Build FFmpeg for Alpine/musl and publish BtbN-style release assets.
# Matrix: master + release lines, full/trimmed variants, x86_64/aarch64.
# The bot image downloads an asset; it never compiles FFmpeg.
name: Build FFmpeg musl

on:
  push:
    paths:
      - 'docker/ffmpeg-musl/**'
      - '.github/workflows/ffmpeg-musl.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ffmpeg-musl-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        version: [master, '9.1', '9.0', '8.1', '8.0', '7.1', '7.0']
        variant: [full, trimmed]
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build FFmpeg ${{ matrix.version }} (${{ matrix.variant }}, ${{ matrix.arch }})
        env:
          VERSION: ${{ matrix.version }}
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            master)
              SOURCE_VERSION=master
              SOURCE_URL="https://github.com/FFmpeg/FFmpeg/archive/refs/heads/master.tar.gz"
              SHA="skip"
              ;;
            9.1)
              SOURCE_VERSION=9.1
              SOURCE_URL="https://ffmpeg.org/releases/ffmpeg-9.1.tar.xz"
              SHA="1a4d394ae63d190a526cd052eb4415c156b5c5e2df37efab41a7de0b8fde2433"
              ;;
            9.0)
              SOURCE_VERSION=9.0.2
              SOURCE_URL="https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz"
              SHA="8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e"
              ;;
            8.1)
              SOURCE_VERSION=8.1.3
              SOURCE_URL="https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz"
              SHA="7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3"
              ;;
            8.0)
              SOURCE_VERSION=8.0.3
              SOURCE_URL="https://ffmpeg.org/releases/ffmpeg-8.0.3.tar.xz"
              SHA="6136812ea6d4e68bdba27e33c2a94382711cdf4f8602ffef056ff792bd6f9818"
              ;;
            7.1)
              SOURCE_VERSION=7.1.5
              SOURCE_URL="https://ffmpeg.org/releases/ffmpeg-7.1.5.tar.xz"
              SHA="de668509caf9e35e3cd162473441fdb29538c6d96ed080292b3cf9e6fc5d558f"
              ;;
            7.0)
              SOURCE_VERSION=7.0.3
              SOURCE_URL="https://ffmpeg.org/releases/ffmpeg-7.0.3.tar.xz"
              SHA="bbb18f3cc5c1c34b21cf176c0168c4d9aa97697542a97f60d491a58a814dea65"
              ;;
          esac
          PLATFORM=linux/amd64
          if [ "$ARCH" = aarch64 ]; then PLATFORM=linux/arm64; fi
          mkdir -p dist artifacts
          docker buildx build \
            --platform "$PLATFORM" \
            --target artifact \
            --output type=local,dest=dist \
            --build-arg FFMPEG_VERSION="$SOURCE_VERSION" \
            --build-arg FFMPEG_SOURCE_URL="$SOURCE_URL" \
            --build-arg FFMPEG_SHA256="$SHA" \
            -f "docker/ffmpeg-musl/$VARIANT/Dockerfile" \
            "docker/ffmpeg-musl/$VARIANT"
          test -x dist/opt/ffmpeg/bin/ffmpeg
          test -x dist/opt/ffmpeg/bin/ffprobe

      - name: Package artifact
        env:
          VERSION: ${{ matrix.version }}
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        run: |
          tar --sort=name \
            --mtime='UTC 2020-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -cJf "artifacts/ffmpeg-$VERSION-musl-$VARIANT-$ARCH.tar.xz" \
            -C dist/opt ffmpeg

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.version }}-${{ matrix.variant }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          merge-multiple: true
          path: artifacts

      - name: Checksums
        run: |
          cd artifacts
          sha256sum *.tar.xz > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: musl-latest
          name: FFmpeg musl runtime
          body: |
            FFmpeg builds for Alpine/musl.

            Versions: master (floating), 9.1, 9.0.2, 8.1.3, 8.0.3, 7.1.5, 7.0.3.
            Variants: full (Alpine feature set), trimmed (bot codec/filter set).
            Architectures: x86_64, aarch64.

            Assets: `ffmpeg-<version>-musl-<variant>-<arch>.tar.xz`, `SHA256SUMS`.
            Each tarball contains `ffmpeg/bin/ffmpeg`, `ffmpeg/bin/ffprobe`,
            `ffmpeg/lib/libav*.so*` and FFmpeg `COPYING.*` files.

            Built by `.github/workflows/ffmpeg-musl.yml`. The release tag is
            rebuilt on build-file changes and weekly; verify downloads against
            `SHA256SUMS`.
          files: artifacts/*
          fail_on_unmatched_files: true
