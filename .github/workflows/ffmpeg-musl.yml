# Build FFmpeg 9.1 for Alpine/musl and publish BtbN-style release assets.
# Two variants:
#   full    - Alpine community/ffmpeg feature set (safe fallback)
#   trimmed - only the codecs/filters the bot uses (smaller)
# The bot image downloads the selected asset; it never compiles FFmpeg.
name: Build FFmpeg 9.1 musl

on:
  push:
    paths:
      - 'docker/ffmpeg-musl/**'
      - '.github/workflows/ffmpeg-musl.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ffmpeg-musl-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            arch: x86_64
            platform: linux/amd64
            runner: ubuntu-24.04
          - variant: full
            arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - variant: trimmed
            arch: x86_64
            platform: linux/amd64
            runner: ubuntu-24.04
          - variant: trimmed
            arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build FFmpeg 9.1 (${{ matrix.variant }})
        run: |
          mkdir -p dist artifacts
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --target artifact \
            --output type=local,dest=dist \
            -f "docker/ffmpeg-musl/${{ matrix.variant }}/Dockerfile" \
            "docker/ffmpeg-musl/${{ matrix.variant }}"
          test -x dist/opt/ffmpeg/bin/ffmpeg
          test -x dist/opt/ffmpeg/bin/ffprobe

      - name: Package artifact
        run: |
          tar --sort=name \
            --mtime='UTC 2020-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -cJf "artifacts/ffmpeg-9.1-musl-${{ matrix.variant }}-${{ matrix.arch }}.tar.xz" \
            -C dist/opt ffmpeg

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.variant }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          merge-multiple: true
          path: artifacts

      - name: Checksums
        run: |
          cd artifacts
          sha256sum *.tar.xz > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: musl-9.1
          name: FFmpeg 9.1 musl runtime
          body: |
            FFmpeg 9.1 for Alpine/musl, built against Alpine edge libraries.

            Variants:
            - `full` — Alpine community/ffmpeg feature set (safe fallback)
            - `trimmed` — only the codecs/filters used by the bot (smaller)

            Assets: `ffmpeg-9.1-musl-<variant>-<arch>.tar.xz`, `SHA256SUMS`.
            Contents: `ffmpeg/bin/ffmpeg`, `ffmpeg/bin/ffprobe`,
            `ffmpeg/lib/libav*.so*`, FFmpeg COPYING files.

            Built by `.github/workflows/ffmpeg-musl.yml`; consumed by the bot
            image after SHA-256 verification. This release tag is rebuilt on
            build-file changes and weekly; verify the downloaded files against
            `SHA256SUMS`.
          files: artifacts/*
          fail_on_unmatched_files: true
