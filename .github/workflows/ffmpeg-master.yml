# Daily FFmpeg master (9.2-dev) builds for Alpine/musl.
# Each run publishes one dated autobuild-master-YYYY-MM-DD-HH-MM release and
# marks it Latest, so releases/latest/download resolves the newest master.
name: Autobuild FFmpeg master musl

on:
  push:
    paths:
      - 'docker/ffmpeg-musl/**'
      - '.github/workflows/ffmpeg-master.yml'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ffmpeg-master-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant: [full, trimmed]
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build FFmpeg master (${{ matrix.variant }}, ${{ matrix.arch }})
        env:
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          SOURCE_VERSION=master
          SOURCE_URL="https://github.com/FFmpeg/FFmpeg/archive/refs/heads/master.tar.gz"
          PLATFORM=linux/amd64
          if [ "$ARCH" = aarch64 ]; then PLATFORM=linux/arm64; fi
          mkdir -p dist artifacts
          docker buildx build \
            --platform "$PLATFORM" \
            --target artifact \
            --output type=local,dest=dist \
            --build-arg FFMPEG_VERSION="$SOURCE_VERSION" \
            --build-arg FFMPEG_SOURCE_URL="$SOURCE_URL" \
            --build-arg FFMPEG_SHA256=skip \
            -f "docker/ffmpeg-musl/$VARIANT/Dockerfile" \
            "docker/ffmpeg-musl/$VARIANT"
          test -x dist/opt/ffmpeg/bin/ffmpeg
          test -x dist/opt/ffmpeg/bin/ffprobe

      - name: Package artifact
        env:
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        run: |
          tar --sort=name \
            --mtime='UTC 2020-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -cJf "artifacts/ffmpeg-master-musl-$VARIANT-$ARCH.tar.xz" \
            -C dist/opt ffmpeg

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-master-${{ matrix.variant }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-master-*
          merge-multiple: true
          path: artifacts

      - name: Checksums
        run: |
          cd artifacts
          sha256sum *.tar.xz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish dated release
        run: |
          set -euo pipefail
          STAMP="$(date -u +'%Y-%m-%d %H:%M UTC')"
          TAG="autobuild-master-$(date -u +'%Y-%m-%d-%H-%M')"
          {
            echo "FFmpeg master (9.2-dev) for Alpine/musl."
            echo
            echo "Built from the FFmpeg master branch at ${STAMP}."
            echo
            echo "| Asset | Size |"
            echo "|:--|--:|"
            for f in artifacts/*.tar.xz; do
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
            echo
            printf 'Checksums: [`SHA256SUMS`](https://github.com/%s/releases/download/%s/SHA256SUMS).\n' "$GH_REPO" "$TAG"
          } > "$RUNNER_TEMP/release-body.md"
          gh release create "$TAG" --target main --latest \
            --title "FFmpeg master musl autobuild ${STAMP}" \
            --notes-file "$RUNNER_TEMP/release-body.md" artifacts/*

      - name: Prune dated releases
        run: |
          set -euo pipefail
          export LC_ALL=C
          mapfile -t tags < <(
            gh release list --limit 200 --json tagName \
              --jq '.[] | select(.tagName | startswith("autobuild-master-")) | .tagName' \
              | sort -r
          )
          keep=()
          for tag in "${tags[@]:0:14}"; do keep+=("$tag"); done
          declare -A seen_months=()
          monthly=0
          for tag in "${tags[@]}"; do
            rest="${tag#autobuild-master-}"
            month="${rest:0:7}"
            if [[ -z "${seen_months[$month]:-}" ]]; then
              seen_months[$month]=1
              keep+=("$tag")
              monthly=$((monthly + 1))
              if (( monthly >= 24 )); then break; fi
            fi
          done
          declare -A keep_set=()
          for tag in "${keep[@]}"; do keep_set[$tag]=1; done
          for tag in "${tags[@]}"; do
            if [[ -z "${keep_set[$tag]:-}" ]]; then
              echo "Deleting $tag"
              gh release delete "$tag" --cleanup-tag --yes || echo "warning: failed to delete $tag"
            fi
          done
