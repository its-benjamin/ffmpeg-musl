# Daily FFmpeg master (9.2-dev) builds for Alpine/musl.
# Separate from the release-line workflow so a broken old version cannot block
# master updates. The bot consumes the trimmed x86_64/aarch64 assets.
name: Build FFmpeg master musl

on:
  push:
    paths:
      - 'docker/ffmpeg-musl/**'
      - '.github/workflows/ffmpeg-master.yml'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ffmpeg-master-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant: [full, trimmed]
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build FFmpeg master (${{ matrix.variant }}, ${{ matrix.arch }})
        env:
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          SOURCE_VERSION=master
          SOURCE_URL="https://github.com/FFmpeg/FFmpeg/archive/refs/heads/master.tar.gz"
          PLATFORM=linux/amd64
          if [ "$ARCH" = aarch64 ]; then PLATFORM=linux/arm64; fi
          mkdir -p dist artifacts
          docker buildx build \
            --platform "$PLATFORM" \
            --target artifact \
            --output type=local,dest=dist \
            --build-arg FFMPEG_VERSION="$SOURCE_VERSION" \
            --build-arg FFMPEG_SOURCE_URL="$SOURCE_URL" \
            --build-arg FFMPEG_SHA256=skip \
            -f "docker/ffmpeg-musl/$VARIANT/Dockerfile" \
            "docker/ffmpeg-musl/$VARIANT"
          test -x dist/opt/ffmpeg/bin/ffmpeg
          test -x dist/opt/ffmpeg/bin/ffprobe

      - name: Package artifact
        env:
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        run: |
          tar --sort=name \
            --mtime='UTC 2020-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -cJf "artifacts/ffmpeg-master-musl-$VARIANT-$ARCH.tar.xz" \
            -C dist/opt ffmpeg

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-master-${{ matrix.variant }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-master-*
          merge-multiple: true
          path: artifacts

      - name: Checksums
        run: |
          cd artifacts
          sha256sum *.tar.xz > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: musl-master
          name: FFmpeg master musl runtime
          body: |
            FFmpeg master (9.2-dev) for Alpine/musl.

            Assets: `ffmpeg-master-musl-<variant>-<arch>.tar.xz`,
            `SHA256SUMS`. Variants: full (Alpine feature set), trimmed (bot
            codec/filter set). Architectures: x86_64, aarch64.

            Rebuilt daily from the FFmpeg master branch and on Dockerfile
            changes. Verify downloads against `SHA256SUMS`.
          files: artifacts/*
          fail_on_unmatched_files: true
